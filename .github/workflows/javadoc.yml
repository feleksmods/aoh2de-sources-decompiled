name: Generate Javadoc

on:
  push:
    branches:
      - java-main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Generate Javadoc
        run: |
            mkdir -p docs/javadoc
            javadoc -d docs/javadoc \
                -encoding UTF-8 \
                -docencoding UTF-8 \
                -charset UTF-8 \
                -Xdoclint:none \
                -sourcepath src/main/java \
                -subpackages age.of.civilizations2:aoc.kingdoms:me.felek
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/javadoc
          branch: gh-pages
